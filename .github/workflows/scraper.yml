name: scraper diario

on:
  schedule:
    # 07:00 UTC todos los días (~02:00 Colombia). El cron de GitHub es "best effort".
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "LIMITE_VIDEOS para esta corrida"
        required: false
        default: "12"

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 5h30, tope duro de GitHub es 6h
    env:
      R2_ACCOUNT_ID: 4e606a01f4fc407cb118d0fafbaee583
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://gegdnoqjglidnijpmhay.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      LIMITE_VIDEOS: ${{ github.event.inputs.limite || '12' }}
      WORKDIR: ${{ github.workspace }}/work

    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias Python
        run: pip install -r scraper/requirements.txt

      - name: Descargar datos NLTK
        run: python -m nltk.downloader -q stopwords punkt punkt_tab

      - name: Ejecutar pipeline
        working-directory: scraper
        run: python run.py

      - name: Espacio en disco final
        if: always()
        run: df -h /
