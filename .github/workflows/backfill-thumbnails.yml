name: backfill miniaturas legacy (manual)

# Migra a R2 las miniaturas de videos viejos (marzo 2026) que todavia
# apuntan directo a xmoviescdn.online -- ver scraper/backfill_thumbnails.py.
# Manual a proposito: no es un job recurrente, es un backfill de una vez
# (re-correrlo despues no rompe nada, subir_thumbnail() ya es idempotente).

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Migrar como maximo N videos (0 = todos los pendientes)"
        required: false
        default: "10"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: 4e606a01f4fc407cb118d0fafbaee583
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SUPABASE_URL: https://gegdnoqjglidnijpmhay.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias Python
        run: pip install boto3 supabase requests pillow

      - name: Migrar miniaturas
        working-directory: scraper
        run: python backfill_thumbnails.py --limite "${{ github.event.inputs.limite }}"
